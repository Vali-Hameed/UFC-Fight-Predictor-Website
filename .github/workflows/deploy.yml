name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main
      - master # Triggers on master or main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/UFC-Fight-Predictor-Website
            
            # Fetch latest changes and reset to match the remote branch exactly
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            echo "--- DEBUG INFO ---"
            git remote -v
            git log -1
            echo "------------------"
            
            # Force kill the old rogue container if it ever respawns
            docker rm -f ufc-backend || true
            
            # Force rebuild the docker images from scratch to prevent aggressive caching bugs
            docker compose --env-file .env -f docker/docker-compose.yml build --no-cache backend
            
            # Recreate and start the containers
            docker compose --env-file .env -f docker/docker-compose.yml up -d backend
            
            # Remove dangling images to save space
            docker image prune -f
