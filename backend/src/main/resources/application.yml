server:
  port: ${PORT:8080}
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING_ERRORS:never}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5332/ufc}
    username: ${DATABASE_USERNAME:ufc_user}
    password: ${DATABASE_PASSWORD:ufc_pass}
  jpa:
    hibernate:
      ddl-auto: update
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        format_sql: false
    show-sql: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

resend:
  api-key: ${RESEND_API_KEY:re_default1234567890}
  from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
  mvc:
    problemdetails:
      enabled: true

jwt:
  secret: ${JWT_SECRET:change-me-in-prod-and-set-env-now}
  refresh-secret: ${JWT_REFRESH_SECRET:change-refresh-in-prod}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7
  cookie-secure: ${JWT_COOKIE_SECURE:false}

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

ml:
  cache-ttl-minutes: ${ML_CACHE_TTL_MINUTES:60}

prewarm:
  enabled: ${PREWARM_ENABLED:true}
  lookahead-hours: ${PREWARM_LOOKAHEAD_HOURS:3}
  cron: ${PREWARM_CRON:0 0 * * * *}

scraper:
  api-key: ${SCRAPER_API_KEY:change-me}
  url: ${SCRAPER_URL:http://localhost:8001}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

rate-limiting:
  global:
    capacity: 100
    refill: 100
    refill-period-seconds: 60
  login:
    capacity: 5
    refill: 5
    refill-period-seconds: 60
  password-reset:
    capacity: 3
    refill: 3
    refill-period-seconds: 3600
  prediction-query:
    capacity: 20
    refill: 20
    refill-period-seconds: 60
  prediction-submit:
    capacity: 5
    refill: 5
    refill-period-seconds: 10
  forum-post:
    capacity: 10
    refill: 10
    refill-period-seconds: 60

