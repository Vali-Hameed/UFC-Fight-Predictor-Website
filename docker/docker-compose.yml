services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ufc}
      POSTGRES_USER: ${POSTGRES_USER:-ufc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ufc_pass}
    ports:
      - "${DB_PORT:-5332}:5432"
    volumes:
      - ufc-db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/ufc}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-ufc_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ufc_pass}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-and-set-env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-in-prod}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      FASTAPI_BASE_URL: ${FASTAPI_BASE_URL:-http://ufc-ml:8000}
      SCRAPER_URL: ${SCRAPER_URL:-http://localhost:8001}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-change-me}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 6g

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  ufc-db-data: