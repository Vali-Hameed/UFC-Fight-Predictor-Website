server:
  error:
    include-message: always
    include-binding-errors: always
spring:
  datasource:
    url: jdbc:postgresql://localhost:5332/postgres
    username: ufc_user
    password: ufc_pass
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        format_sql: true
    show-sql: true
  mail:
    host: localhost
    port: 1025
    username: hello
    password: hello
    properties:
      mail:
        smtp:
          ssl:
            trust: "*"
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:change-me-in-prod-and-set-env}
  refresh-secret: ${JWT_REFRESH_SECRET:change-refresh-in-prod}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}

